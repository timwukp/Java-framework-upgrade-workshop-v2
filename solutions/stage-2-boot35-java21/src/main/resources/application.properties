spring.application.name=user-management-service
server.port=8080
# Renamed in Spring Boot 3 (was server.max-http-header-size)
server.max-http-request-header-size=16KB

# Default: H2 in-memory database, no installation needed.
# Use the "postgres" profile (application-postgres.properties) for PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA - Hibernate 6 detects the dialect, so no hibernate.dialect property
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# In-memory users. Leave the passwords empty to get a generated password in the startup log.
app.security.admin.username=${APP_ADMIN_USERNAME:admin}
app.security.admin.password=${APP_ADMIN_PASSWORD:}
app.security.user.username=${APP_USER_USERNAME:user}
app.security.user.password=${APP_USER_PASSWORD:}

logging.level.root=INFO
logging.level.com.example.usermanagement=INFO
logging.level.org.hibernate.SQL=WARN
